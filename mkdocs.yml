site_name: "BESAFE - Documentation"
site_description: "Wiki technique du projet BESAFE"
site_url: "https://ilangaussin.github.io/BESAFE/"

docs_dir: docs

theme:
  name: material
  language: fr
  logo: assets/besafe.png
  favicon: assets/besafe.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md

  - Architecture:
      - Inventaire matériel: architecture/inventaire-materiel.md
      - VLAN / Plan IP: architecture/vlan-plan-ip.md
      - Schéma: architecture/schema.md
  
  - Virtualisation:
      - ESXi: virtualisation/esxi.md
      - vCenter: virtualisation/vcenter.md

  - Réseaux:
      - Switch: reseaux/switch.md
      - Stormshield: reseaux/stormshield.md
      - Fortigate: reseaux/fortigate.md
      
  - Systèmes:
      - AD DS / DHCP / DNS: systemes/ad.md
      - PKI / AD CS: systemes/pki.md
      - Sauvegardes: systemes/veeambackup.md
      
  - Services:
      - Vaultwarden: services/vaultwarden.md
      - Nextcloud: services/nextcloud.md
      - GLPI: services/glpi.md
      - Nginx Proxy Manager: services/npm.md

  - Supervision:
      - Centreon: supervision/centreon.md

  - Sécurité:
      - Wazuh: security/wazuh.md
